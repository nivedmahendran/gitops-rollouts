name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: yamllint -c .yamllint rollout/ argocd/

  lint-ansible:
    name: Lint Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pip install ansible-core ansible-lint

      - name: ansible-lint
        run: ansible-lint ansible/rollouts.yml

  validate-manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes objects
        run: |
          kubeconform -summary -strict -ignore-missing-schemas rollout/

      - name: Build kustomize output
        run: |
          curl -sSLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize build rollout/ > /tmp/rendered.yml
          echo "rendered $(grep -c '^kind:' /tmp/rendered.yml) objects"

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan K8s manifests with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: rollout/
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Scan Dockerfile with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: app/Dockerfile
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint-yaml, lint-ansible, validate-manifests]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gitops-rollouts-demo:${{ github.sha }} app/

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8080:8080 gitops-rollouts-demo:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "health endpoint responded"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8080/metrics | grep -q http_requests_total \
            && echo "metrics endpoint exports http_requests_total"
          docker rm -f smoke
